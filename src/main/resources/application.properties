spring.application.name=sistema-vendas

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sistema_vendas}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha123}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Usuários do sistema (definidos por variáveis de ambiente)
app.usuarios.admin.email=${ADMIN_EMAIL:admin@vendas.com}
app.usuarios.admin.senha=${ADMIN_SENHA}
app.usuarios.padrao.email=${PADRAO_EMAIL:padrao@vendas.com}
app.usuarios.padrao.senha=${PADRAO_SENHA}
