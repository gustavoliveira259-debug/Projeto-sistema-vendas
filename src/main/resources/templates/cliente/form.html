<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:unless="${cliente.id == null}">Edição de Cliente</title>
    <title th:if="${cliente.id == null}">Cadastro de Cliente</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 th:text="${cliente.id == null} ? 'Novo Cliente' : 'Editar Cliente'"></h2>

        <form th:action="${cliente.id == null} ? @{/clientes/novo} : @{/clientes/edit/{id}(id=${cliente.id})}"
            th:object="${cliente}" method="post">

            <!-- NOME -->
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}">

                <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" id="email" th:field="*{email}">

                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                </div>
            </div>

            <!-- CPF -->
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" th:field="*{cpf}">

                <div class="text-danger" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}">
                </div>
            </div>

            <!-- TELEFONE -->
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" th:field="*{telefone}">

                <div class="text-danger" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">
                </div>
            </div>

            <!-- LOGRADOURO -->
            <div class="mb-3">
                <label for="logradouro" class="form-label">Logradouro</label>
                <input type="text" class="form-control" id="logradouro" th:field="*{logradouro}">
            </div>

            <div class="mb-3">
                <label for="numero" class="form-label">Número</label>
                <input type="text" class="form-control" id="numero" th:field="*{numero}">
            </div>

            <div class="mb-3">
                <label for="complemento" class="form-label">Complemento</label>
                <input type="text" class="form-control" id="complemento" th:field="*{complemento}">
            </div>

            <div class="mb-3">
                <label for="bairro" class="form-label">Bairro</label>
                <input type="text" class="form-control" id="bairro" th:field="*{bairro}">
            </div>

            <div class="mb-3">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" th:field="*{cidade}">
            </div>

            <div class="mb-3">
                <label for="uf" class="form-label">UF</label>
                <input type="text" class="form-control" id="uf" th:field="*{uf}" maxlength="2">
            </div>

            <div class="mb-3">
                <label for="cep" class="form-label">CEP</label>
                <input type="text" class="form-control" id="cep" th:field="*{cep}">
            </div>


            <button type="submit" class="btn btn-primary">
                Salvar
            </button>

            <a th:href="@{/clientes}" class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>


</body>

</html>
