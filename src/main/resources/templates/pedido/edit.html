<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edição de Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="'Pedido nº ' + ${pedido.id}"></h1>
    <p>
        <strong>Cliente:</strong> <span th:text="${pedido.cliente.nome}"></span><br>
        <strong>Data:</strong> <span th:text="${#temporals.format(pedido.data_pedido, 'dd/MM/yyyy HH:mm')}"></span>
    </p>

    <h4>Adicionar item</h4>
    <form class="row g-2 mb-4" th:action="@{/pedidos/{id}/adicionar-item(id=${pedido.id})}" method="post">
        <div class="col-md-6">
            <select class="form-select" name="produtoId" required>
                <option value="">Selecione um produto</option>
                <option th:each="produto : ${produtos}" th:value="${produto.id}"
                        th:text="${produto.nome} + ' - ' + ${#numbers.formatCurrency(produto.preco)} + ' (estoque: ' + ${produto.quantidadeEstoque} + ')'"></option>
            </select>
        </div>
        <div class="col-md-3">
            <input type="number" class="form-control" name="quantidade" min="1" value="1" required>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-success w-100">Adicionar</button>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço Unitário</th>
            <th>Subtotal</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${pedido.itens}">
            <td th:text="${item.produto.nome}"></td>
            <td th:text="${item.quantidade}"></td>
            <td th:text="${#numbers.formatCurrency(item.preco_unitario)}"></td>
            <td th:text="${#numbers.formatCurrency(item.preco_unitario * item.quantidade)}"></td>
            <td>
                <form th:action="@{/pedidos/{pedidoId}/remover-item/{itemId}(pedidoId=${pedido.id}, itemId=${item.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-danger">Remover</button>
                </form>
            </td>
        </tr>
        <tr th:if="${pedido.itens.isEmpty()}">
            <td colspan="5" class="text-center">Nenhum item adicionado.</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">Total</th>
            <th colspan="2" th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></th>
        </tr>
        </tfoot>
    </table>

    <form th:action="@{/pedidos/{id}/finalizar(id=${pedido.id})}" method="post" class="d-inline">
        <button type="submit" class="btn btn-primary">Finalizar Pedido</button>
    </form>
    <a th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}" class="btn btn-danger">Cancelar Pedido</a>
    <a th:href="@{/pedidos}" class="btn btn-secondary">Voltar</a>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
