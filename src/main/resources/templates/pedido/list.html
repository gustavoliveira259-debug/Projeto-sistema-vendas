<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Pedidos</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Pedidos</h1>
    <a class="btn btn-primary mb-3" th:href="@{/pedidos/novo}">Novo Pedido</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Nº</th>
            <th>Cliente</th>
            <th>Data</th>
            <th>Valor Total</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pedido : ${pedidos}">
            <td th:text="${pedido.id}"></td>
            <td th:text="${pedido.cliente.nome}"></td>
            <td th:text="${#temporals.format(pedido.data_pedido, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></td>
            <td th:text="${pedido.status}"></td>
            <td>
                <th:block th:if="${pedido.status.name() == 'ATIVO'}">
                    <a class="btn btn-sm btn-warning" th:href="@{/pedidos/edit/{id}(id=${pedido.id})}">Editar</a>
                    <a class="btn btn-sm btn-danger" th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}">Cancelar</a>
                </th:block>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
